[package]
name = "agent-workspace-agent-os-connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Runs Agent OS agents as a host on Agent Workspace's host protocol, bridged through the Agent OS controller (A2.25)."

[[bin]]
name = "aw-agentos-connector"
path = "src/main.rs"

[dependencies]
agent-workspace-host-protocol = { version = "0.0.1", path = "../../crates/host-protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[lints]
workspace = true
