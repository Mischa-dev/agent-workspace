[package]
name = "agent-workspace-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
async-trait = "0.1.91"
aws-lc-rs = { version = "1.17.3", default-features = false, features = ["aws-lc-sys"] }
axum = { version = "0.8.7", features = ["json", "ws"] }
base64 = "0.22.1"
command-fds = { version = "0.3.3", features = ["tokio"] }
agent-workspace-redaction = { version = "0.0.1", path = "../../crates/redaction" }
agent-workspace-builtin-host = { version = "0.0.1", path = "../../crates/builtin-host" }
codex-bridge-spike = { version = "0.0.1", path = "../../tools/codex-bridge-spike" }
agent-workspace-host-protocol = { version = "0.0.1", path = "../../crates/host-protocol" }
chrono = "0.4.45"
crc32fast = "1.5.2"
dotenvy = "0.15.7"
flate2 = "1.1.10"
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs"] }
fs2 = "0.4.3"
futures-util = "0.3.33"
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.1"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
regex-lite = "0.1.9"
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
rmcp = { version = "=3.9.0", features = ["transport-streamable-http-server"] }
roxmltree = "0.21.1"
rpassword = "7.4.0"
rustix = { version = "1.1.4", features = ["fs", "process"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_urlencoded = "0.7.1"
ring = "0.17.14"
sha2 = "0.10.9"
skrifa = "0.44.0"
sqlx = { version = "0.8.6", default-features = false, features = [
  "migrate",
  "macros",
  "postgres",
  "runtime-tokio-rustls",
  "uuid",
  "chrono",
] }
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7.16"
tower-http = { version = "0.6.6", features = ["fs", "request-id", "set-header", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
webpki-roots = "1.0.9"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
yrs = "0.28.1"
ironcalc_base = "0.9.1"
ironcalc = "0.9.1"
csv = "1.4.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
url = "2.5.7"
zeroize = "1.8.2"
chrono-tz = "0.10.4"
jpeg-encoder = "0.7.0"
imagesize = "0.15.0"
mime_guess = "2.0.5"
tower = { version = "0.5.2", features = ["util"] }

[dev-dependencies]
agent-workspace-delivery-contract = { version = "0.0.1", path = "../../crates/delivery-contract" }
agent-workspace-host-conformance = { version = "0.0.1", path = "../../crates/host-conformance" }
agent-workspace-minimal-host = { version = "0.0.1", path = "../../examples/minimal-host" }
reqwest = { version = "0.12.28", default-features = false }
tempfile = "3.23.0"
tokio-tungstenite = "0.29.0"

[lints]
workspace = true

[[bench]]
name = "sheet_engine"
harness = false
