[package]
name = "agent-workspace-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
aws-lc-rs = { version = "1.17.3", default-features = false, features = ["aws-lc-sys"] }
axum = { version = "0.8.7", features = ["json", "ws"] }
base64 = "0.22.1"
command-fds = { version = "0.3.3", features = ["tokio"] }
codex-bridge-spike = { version = "0.0.1", path = "../../tools/codex-bridge-spike" }
chrono = "0.4.45"
dotenvy = "0.15.7"
fs2 = "0.4.3"
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.1"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
rmcp = { version = "=3.0.1", features = ["transport-streamable-http-server"] }
rpassword = "7.4.0"
rustix = { version = "1.1.4", features = ["fs", "process"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = [
  "migrate",
  "macros",
  "postgres",
  "runtime-tokio-rustls",
  "uuid",
  "chrono",
] }
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7.16"
tower-http = { version = "0.6.6", features = ["fs", "request-id", "set-header", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }
url = "2.5.7"
zeroize = "1.8.2"
chrono-tz = "0.10.4"

[dev-dependencies]
futures-util = "0.3.33"
reqwest = { version = "0.12.28", default-features = false }
tempfile = "3.23.0"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true
