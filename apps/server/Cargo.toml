[package]
name = "agent-workspace-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
axum = { version = "0.8.7", features = ["json", "ws"] }
base64 = "0.22.1"
codex-bridge-spike = { version = "0.0.1", path = "../../tools/codex-bridge-spike" }
dotenvy = "0.15.7"
fs2 = "0.4.3"
http = "1.3.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rpassword = "7.4.0"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = [
  "migrate",
  "macros",
  "postgres",
  "runtime-tokio-rustls",
  "uuid",
] }
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6.6", features = ["fs", "request-id", "set-header", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }
zeroize = "1.8.2"

[dev-dependencies]
futures-util = "0.3.33"
reqwest = { version = "0.12.28", default-features = false }
tempfile = "3.23.0"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true
