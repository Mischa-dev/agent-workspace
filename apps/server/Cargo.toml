[package]
name = "agent-workspace-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.7", features = ["json", "ws"] }
dotenvy = "0.15.7"
http = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = [
  "migrate",
  "macros",
  "postgres",
  "runtime-tokio-rustls",
  "uuid",
] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.6", features = ["request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
