[workspace]
members = [
  "apps/server",
  "connectors/agent-os",
  "crates/delivery-contract",
  "crates/host-conformance",
  "crates/host-protocol",
  "crates/redaction",
  "crates/builtin-host",
  "examples/minimal-host",
  "tools/codex-bridge-spike",
  "tools/host-maintenance",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# Line tables keep file:line in backtraces and drop the rest of the debug
# info. With all of it, one build of the server crate needs more memory than
# a 16 GB machine has (a cloud session's first build was killed); without, it
# peaks near 12 GB, and the build cache is a fraction of the size.
[profile.dev]
debug = "line-tables-only"

# Password hashing runs at production strength in tests too (a weaker
# setting would test the wrong thing), and unoptimized it takes about three
# seconds a hash. Optimizing just these two crates keeps test builds quick
# to compile and cuts the Rust test suite by about five minutes.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
