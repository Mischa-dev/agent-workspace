[workspace]
members = [
  "apps/server",
  "tools/codex-bridge-spike",
  "tools/host-maintenance",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# Password hashing runs at production strength in tests too (a weaker
# setting would test the wrong thing), and unoptimized it takes about three
# seconds a hash. Optimizing just these two crates keeps test builds quick
# to compile and cuts the Rust test suite by about five minutes.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
