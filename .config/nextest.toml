# Used by tools/ci/checks.sh (`cargo nextest run --profile ci`).
[profile.ci]
# No retries: a test that fails and then passes on retry is a race, and CI
# must go red on it (P0.3). A test that truly needs one gets a named override
# below with a comment saying why; race, claim, lease, bootstrap and
# credential tests never do.
retries = 0
fail-fast = false
failure-output = "final"
slow-timeout = { period = "60s", terminate-after = 5 }

# Per-test times, kept with the run (target/nextest/ci/junit.xml).
[profile.ci.junit]
path = "junit.xml"

# Failed once and passed on retry on main (2026-11-14, a loaded runner) and
# didn't fail in eight local runs; no race was found by reading it. One retry
# while it is looked into (P0.3's follow-up task). Never add one of these for
# a race, claim, lease, bootstrap or credential test.
[[profile.ci.overrides]]
filter = "test(=w7_launch::launches_use_the_defaults_queue_in_order_and_recheck_access)"
retries = 1

# The isolation sweeps call every read and write route and tool as each
# workspace against the other's ids (hundreds of calls), and take four to
# five minutes on a shared runner (the agent and app sweeps read a tools
# list of close to a megabyte for each). Slow by size, not by waiting on
# anything: they get ten minutes instead of five. Retries stay at zero. The
# read sweep runs once per edge (http, an app, an agent, realtime), so its
# filter matches every edge's test.
#
# The idle-cost test makes ten thousand workspaces, each through the
# triggers that give it its space and roles, then counts two idle windows:
# three to four minutes alone, by size, and a minute before each window
# for PostgreSQL's statistics to land. Ten minutes too; no retry.
#
# The lifecycle test digests every table's rows of the second workspace
# before and after deleting the first (the isolation sweep's ids, against
# every table with an id): about a minute alone, and over four minutes on a
# loaded runner at the end of the run. Slow by size; ten minutes, no retry.
[[profile.ci.overrides]]
filter = "test(/^workspace_isolation::one_workspace_never_sees_another_/) | test(=workspace_isolation::a_token_for_one_workspace_never_sees_another_its_account_is_in) | test(=write_isolation::one_workspace_never_writes_to_another) | test(=idle_cost::ten_thousand_quiet_workspaces_cost_what_one_does) | test(=workspace_lifecycle::a_workspace_is_suspended_kept_and_deleted_without_touching_another)"
slow-timeout = { period = "60s", terminate-after = 10 }

# The sweeps are CPU-bound and sort last, so they used to start together
# and starve each other: the agent sweep, four minutes alone, ran past ten
# with five others beside it (#308). Two at a time keeps each near its own
# time, and the run no longer than before.
[test-groups]
isolation-sweeps = { max-threads = 2 }

[[profile.ci.overrides]]
filter = "test(/^workspace_isolation::one_workspace_never_sees_another_/) | test(=workspace_isolation::a_token_for_one_workspace_never_sees_another_its_account_is_in) | test(=write_isolation::one_workspace_never_writes_to_another)"
test-group = "isolation-sweeps"
