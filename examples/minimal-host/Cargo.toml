[package]
name = "agent-workspace-minimal-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The smallest host on the host protocol: one echo agent (A1.23)."

[[bin]]
name = "minimal-host"
path = "src/main.rs"

[dependencies]
agent-workspace-host-protocol = { path = "../../crates/host-protocol" }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[lints]
workspace = true
