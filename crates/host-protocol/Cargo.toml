[package]
name = "agent-workspace-host-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The host protocol's wire types, push signing and a small client (A1.12)."

[dependencies]
base64 = "0.22.1"
hmac = "0.12.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
uuid = { version = "1.18.1", features = ["serde"] }

[lints]
workspace = true
