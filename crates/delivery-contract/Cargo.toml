[package]
name = "agent-workspace-delivery-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The contract for what agents are told: fixtures, webhook verification, and a suite run against a server (A2.7)."

[[bin]]
name = "delivery-contract"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
hmac = "0.12.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
