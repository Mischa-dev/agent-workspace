[package]
name = "agent-workspace-host-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Checks a host against the host protocol, and a server against it (A1.23)."

[[bin]]
name = "host-conformance"
path = "src/main.rs"

[dependencies]
agent-workspace-host-protocol = { version = "0.0.1", path = "../host-protocol" }
axum = { version = "0.8.7", features = ["json"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
agent-workspace-minimal-host = { version = "0.0.1", path = "../../examples/minimal-host" }

[lints]
workspace = true
