[advisories]
# smallstr is unmaintained (RUSTSEC-2026-0215); no vulnerability is known. It
# comes with yrs, the server's Yjs library for live pages (AWD-53), and no yrs
# release has moved off it yet (0.28.1 is the latest, November 2026). Take this
# out once one has.
ignore = [
  { id = "RUSTSEC-2026-0215", reason = "unmaintained, not vulnerable; a dependency of yrs (live pages)" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# jpeg-encoder (picture thumbnails, W20) carries the Independent JPEG Group's
# license as well as MIT or Apache-2.0. It is permissive; a binary release must
# say in its documentation that "this software is based in part on the work of
# the Independent JPEG Group" (see NOTICE).
[[licenses.exceptions]]
crate = "jpeg-encoder"
allow = ["IJG"]

[licenses.private]
ignore = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
