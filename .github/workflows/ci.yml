name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both jobs run on the self-hosted runner on the Red Hat host. It already has
# the pinned Rust toolchain (rust-toolchain.toml), Node 24.18.1 and pnpm on its
# PATH, and a PostgreSQL 18.4 test database; the tests isolate themselves in
# per-run schemas. The repository is private, so only collaborators can start
# jobs here.
jobs:
  rust:
    runs-on: [self-hosted, redhat-aw]
    env:
      AGENT_WORKSPACE_DATABASE_URL: postgres://aw_test:aw_test@127.0.0.1:55433/aw_ci
      AGENT_WORKSPACE_ENV: test
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo fmt --check
      - run: ./tools/verify-self-hosted-guide.sh
      - run: python3 tools/hermes-connector/verify-fixtures.py
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check

  web:
    runs-on: [self-hosted, redhat-aw]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:assets
      - run: pnpm check:performance-tools
