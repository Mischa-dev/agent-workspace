name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job itself is light: it runs on the self-hosted runner on the Red Hat
# host and hands the checks to tools/ci/run.sh, which picks the best machine
# that's free (Mischa's laptop when it's idle, otherwise the Red Hat host),
# keeps each machine's build cache warm, and streams the output back here.
# The repository is private, so only collaborators can start jobs.
jobs:
  ci:
    runs-on: [self-hosted, redhat-aw]
    timeout-minutes: 75
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # Pull requests run only the checks their files touch; pushes to main run all.
      - id: changes
        if: github.event_name == 'pull_request'
        run: >-
          ./tools/ci/changed-areas.sh
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}
          >> "$GITHUB_OUTPUT"
      - run: ./tools/ci/run.sh --areas "${{ steps.changes.outputs.areas || 'rust,web' }}"
