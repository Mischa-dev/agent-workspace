name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. A run on main is never
# cancelled: it is the only run that saves the Rust build caches every pull
# request starts from, and back-to-back merges used to cancel it every time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runs on GitHub's own hosted runners only (4 cores and 16 GB each on a public
# repository), never on one of our own machines: on a public repository anyone's
# fork pull request starts this workflow, so it must not reach our machines.
# tools/ci/test_workflows.py fails if a job names any other runner.
#
# tools/ci/checks.sh runs the same checks here as tools/ci/run.sh runs on the
# laptop or the Red Hat host before an agent pushes. Here they are split into
# parallel jobs, each running one part (CI_PART, see checks.sh):
#
#   changes ─┬─ lint (quick checks, fmt, clippy, deny)
#            ├─ web (lint, types, tests, build, budgets)
#            └─ rust-build ─┬─ rust-tests × 6 (one slice of the tests each)
#                           └─ e2e × 3 (one shard of the browser tests each)
#   ci: passes when every job that ran passed. It is the required check.
env:
  CI_RUN_ID: gh${{ github.run_id }}_${{ github.run_attempt }}
  # A throwaway service database: the passwords are not secrets. The checks
  # connect as aw_app, which the "database role" step makes.
  CI_DATABASE_BASE: postgres://aw_app:aw_app@127.0.0.1:5432
  CI_NEXTEST_ARCHIVE: /tmp/aw-ci/nextest-archive.tar.zst
  # The runner image's Google Chrome drives the Playwright smoke tests.
  PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome

jobs:
  # Pull requests run only the checks their files touch; pushes to main run all.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      areas: ${{ steps.areas.outputs.areas }}
      rust: ${{ contains(steps.areas.outputs.areas, 'rust') }}
      web: ${{ contains(steps.areas.outputs.areas, 'web') }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT}" = pull_request ]; then
            ./tools/ci/changed-areas.sh "${BASE_SHA}" "${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "areas=rust,web" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AREAS: ${{ needs.changes.outputs.areas }}
      CI_PART: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: tools/ci/rust-toolchain.sh
      # Swatinem/rust-cache v2.9.3: target/ and ~/.cargo. Only main saves, so
      # a pull request can't fill the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Checks
        run: ./tools/ci/checks.sh "${AREAS}"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AREAS: ${{ needs.changes.outputs.areas }}
      CI_PART: web
      # The budget step prints each asset limit's change against this.
      BUDGET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The budget step builds the base commit to compare against.
          fetch-depth: 0
          persist-credentials: false
      - name: Checks
        run: ./tools/ci/checks.sh "${AREAS}"

  # Builds every Rust test binary once into a nextest archive for the
  # rust-tests jobs, and the server binary the e2e jobs drive (so it runs for
  # a web-only change too); then the doc tests and the schema snapshot.
  rust-build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres: &postgres
        # The same image docker-compose.dev.yml uses.
        image: docker.io/library/postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: aw_ci
          POSTGRES_PASSWORD: aw_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Docker's default 64 MB of shared memory runs out once the test
        # database is large: parallel queries late in the run then fail
        # with "could not resize shared memory segment" (53100).
        options: >-
          --shm-size 512m
          --health-cmd "pg_isready -U aw_ci" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      AREAS: ${{ needs.changes.outputs.areas }}
      CI_PART: rust-build
    steps:
      # The runner has about 14 GB free; the test build needs more. Removing
      # these takes a minute and a half, so it runs while the build starts.
      - name: Free disk space
        run: |
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          tools/ci/rust-toolchain.sh
          # Optimized dependencies for the tests (see the file).
          cat tools/ci/cargo-ci.toml >> "${CARGO_HOME:-${HOME}/.cargo}/config.toml"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: PostgreSQL 18 client and age
        run: tools/ci/postgres-client.sh
      - name: A database role bound by row rules
        run: tools/ci/postgres-role.sh
      - name: Checks
        run: ./tools/ci/checks.sh "${AREAS}"
      # The archive is already compressed.
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.changes.outputs.rust == 'true'
        with:
          name: nextest-archive
          path: ${{ env.CI_NEXTEST_ARCHIVE }}
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-binary
          path: target/debug/agent-workspace-server
          retention-days: 1
      # The schema snapshot (P0.35), kept with the run.
      - name: Keep the schema
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-reports-schema
          path: target/schema.sql
          if-no-files-found: ignore
          retention-days: 14

  # One slice of the Rust tests each, from rust-build's archive, against a
  # PostgreSQL of its own.
  rust-tests:
    needs: [changes, rust-build]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4, 5, 6]
    services:
      postgres: *postgres
    env:
      AREAS: ${{ needs.changes.outputs.areas }}
      CI_PART: rust-tests
      CI_SHARD: ${{ matrix.slice }}/6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # backup_restore.rs (H1.16) restores a real backup set: it needs a
      # pg_dump and pg_restore at least as new as the service's PostgreSQL,
      # and age for an encrypted set, and skips without them.
      - name: PostgreSQL 18 client and age
        run: tools/ci/postgres-client.sh
      - name: A database role bound by row rules
        run: tools/ci/postgres-role.sh
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nextest-archive
          path: /tmp/aw-ci
      - name: Checks
        run: ./tools/ci/checks.sh "${AREAS}"
      # Per-test times (P0.3), kept with the run.
      - name: Keep test times
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-reports-rust-${{ matrix.slice }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # One shard of the Playwright smoke tests each, against the server binary
  # rust-build made, with its own server and database. They drive the server
  # as much as the web app, so they run for a change on either side.
  e2e:
    needs: [changes, rust-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres: *postgres
    env:
      AREAS: ${{ needs.changes.outputs.areas }}
      CI_PART: e2e
      CI_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: PostgreSQL 18 client and age
        run: tools/ci/postgres-client.sh
      - name: A database role bound by row rules
        run: tools/ci/postgres-role.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: server-binary
          path: target/debug
      - name: Checks
        run: |
          chmod +x target/debug/agent-workspace-server
          ./tools/ci/checks.sh "${AREAS}"

  # The required check. Every job above that ran must have passed; one a pull
  # request's files didn't need is skipped and counts as passing.
  ci:
    needs: [changes, lint, web, rust-build, rust-tests, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Jobs: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *) echo "A job ended '${result}'."; exit 1 ;;
            esac
          done
