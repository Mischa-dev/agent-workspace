name: Image

# Builds the server image (deploy/container/Containerfile) for amd64 and
# arm64, starts it with compose and checks it gets ready (H1.13). Runs on a
# release tag and on demand, never on pull requests. Only a tag publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agent-workspace

jobs:
  amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build
        run: >-
          docker build -f deploy/container/Containerfile
          --build-arg AGENT_WORKSPACE_BUILD_COMMIT=${{ github.sha }}
          -t agent-workspace:ci .
      - name: Smoke test
        run: tools/ci/image-smoke.sh agent-workspace:ci
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/ci/image-publish.sh agent-workspace:ci amd64

  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build
        run: >-
          docker build -f deploy/container/Containerfile
          --build-arg AGENT_WORKSPACE_BUILD_COMMIT=${{ github.sha }}
          -t agent-workspace:ci .
      - name: Smoke test
        run: tools/ci/image-smoke.sh agent-workspace:ci
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/ci/image-publish.sh agent-workspace:ci arm64

  manifest:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [amd64, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: One tag for both architectures
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          printf '%s' "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "${GITHUB_REF_NAME}" "${GITHUB_SHA}"; do
            docker buildx imagetools create -t "$image:$tag" \
              "$image:$GITHUB_SHA-amd64" "$image:$GITHUB_SHA-arm64"
          done
